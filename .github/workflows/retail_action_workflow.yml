name: Generate Retail Action Report (盘前行动)

on:
  # 仅支持手动触发
  workflow_dispatch:
    inputs:
      model:
        description: 'GPT模型名称 (下拉选择)'
        required: false
        default: 'z-ai/glm-5.2'
        type: choice
        options:
          - 'openai/gpt-5.4-mini'
          - 'nvidia/nemotron-3-ultra-550b-a55b'
          - 'thinkingmachines/inkling'
          - 'poolside/laguna-xs-2.1'
          - 'z-ai/glm-5.2'
          - 'minimaxai/minimax-m3'
          - 'moonshotai/kimi-k2.6'
          - 'custom (手写输入)'
      custom_model:
        description: '手写模型名称 (填此项将优先使用，支持任意自定义模型)'
        required: false
        default: ''
        type: string
      gpt_base_url:
        description: 'OpenAI API Base URL (下拉选择)'
        required: false
        default: 'https://integrate.api.nvidia.com/v1'
        type: choice
        options:
          - 'https://gateway.ai.cloudflare.com/v1/cbb425c1b4186b90437390d353e01ce8/openrouter/openrouter'
          - 'https://integrate.api.nvidia.com/v1'
          - 'custom (手写输入)'
      custom_base_url:
        description: '手写 Base URL (填此项将优先使用，支持任意自定义 URL)'
        required: false
        default: ''
        type: string
      api_key:
        description: 'API Key (选 NVIDIA 留空即可，后台将自动赋默认值 nvapi-sQ83...)'
        required: false
        default: ''
        type: string

jobs:
  generate_retail_action_report:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: yjq001/sex-robot
          path: ./sex-robot
          token: ${{ secrets.PAT_TOKEN }}
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Copy files from private repository
        run: |
          cp -r ./sex-robot/* ./

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pip setuptools wheel
          pip install -r infos/requirements.txt

      - name: Run retail action generator
        env:
          INPUT_MODEL: ${{ github.event.inputs.model || 'z-ai/glm-5.2' }}
          INPUT_CUSTOM_MODEL: ${{ github.event.inputs.custom_model }}
          INPUT_BASE_URL: ${{ github.event.inputs.gpt_base_url || 'https://integrate.api.nvidia.com/v1' }}
          INPUT_CUSTOM_BASE_URL: ${{ github.event.inputs.custom_base_url }}
          INPUT_API_KEY: ${{ github.event.inputs.api_key }}
        run: |
          MODEL="$INPUT_MODEL"
          if [ ! -z "$INPUT_CUSTOM_MODEL" ]; then
            MODEL="$INPUT_CUSTOM_MODEL"
          elif [ "$MODEL" = "custom (手写输入)" ]; then
            MODEL="z-ai/glm-5.2"
          fi

          GPT_BASE_URL="$INPUT_BASE_URL"
          if [ ! -z "$INPUT_CUSTOM_BASE_URL" ]; then
            GPT_BASE_URL="$INPUT_CUSTOM_BASE_URL"
          elif [ "$GPT_BASE_URL" = "custom (手写输入)" ]; then
            GPT_BASE_URL=""
          fi

          OPENAI_API_KEY=""

          # 根据模型自动选择或应用对应的 API Key 与 Base URL
          if [ ! -z "$INPUT_API_KEY" ]; then
            OPENAI_API_KEY="$INPUT_API_KEY"
          elif [[ "$GPT_BASE_URL" == *"nvidia"* ]] || [[ "$MODEL" == *"nvidia"* ]]; then
            OPENAI_API_KEY="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"
            # 如果选择 NVIDIA 模型但 Base URL 没选对，自动匹配为 NVIDIA API 地址
            if [[ "$GPT_BASE_URL" != *"nvidia"* ]]; then
              GPT_BASE_URL="https://integrate.api.nvidia.com/v1"
            fi
          fi

          # 更新配置文件中的 GPT base URL
          if [ ! -z "$GPT_BASE_URL" ]; then
            sed -i "s|API_BASE_URL = .*|API_BASE_URL = $GPT_BASE_URL|" infos/config.ini
          fi
          # 更新配置文件中的 API Key（仅针对填了自定义 key 或选择 NVIDIA 时才修改）
          if [ ! -z "$OPENAI_API_KEY" ]; then
            sed -i "s|OPENAI_API_KEY = .*|OPENAI_API_KEY = $OPENAI_API_KEY|" infos/config.ini
          fi

          # 导出环境变量，供脚本优先读取
          export OPENAI_API_KEY="${OPENAI_API_KEY}"
          export OPENROUTER_API_KEY="${OPENAI_API_KEY}"
          if [ ! -z "$GPT_BASE_URL" ]; then
            export OPENAI_API_BASE="$GPT_BASE_URL"
          fi

          echo "MODEL=$MODEL"
          echo "GPT_BASE_URL=$GPT_BASE_URL"

          cd infos
          python retail_action_generator.py --model "$MODEL"
