name: 🖥️ Build WM Harness Desktop

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源代码仓库 (格式: owner/repo)'
        required: true
        default: 'yjq001/wm-harness'
      source_branch:
        description: '源代码分支'
        required: true
        default: 'feature/desktop-packaging'
      environment:
        description: '打包环境 (test=开发版渠道, prod=正式版渠道)'
        required: true
        type: choice
        default: 'test'
        options:
          - test
          - prod
      version:
        description: '四段版本号, 例如 0.1.8.1; 留空则取最高正式版加一'
        required: false
        default: ''
      notes:
        description: '更新说明 (仅 prod, 显示在客户端的更新提示里)'
        required: false
        default: ''
      targets:
        description: '打包平台'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64

# 本仓库是公开仓库: 日志对所有人可见, 安装包内含共享服务凭据。
# 不要在步骤里打印环境变量, 不要使用 upload-artifact; 产物只上传到腾讯云 COS。
permissions:
  contents: read

env:
  COS_BUCKET: romsfiles-1251438792
  COS_REGION: ap-guangzhou
  COS_PREFIX: wm-harness
  # 还没有发布过正式版且没填版本号时使用。
  WMH_FIRST_VERSION: '0.1.8.8'

jobs:
  plan:
    name: 🔢 确定版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔢 确定版本号
        id: version
        env:
          WMH_VERSION: ${{ inputs.version }}
        run: |
          # 版本号只以 versions.js 里的正式版为准: 最高正式版加一。
          # 只有正式版打包会更新 versions.js, 所以两次正式版之间的测试包都是同一个版本号。
          python3 - <<'EOF'
          import json, os, re, sys, urllib.error, urllib.request

          requested = os.environ['WMH_VERSION'].strip()
          if requested:
              if not re.fullmatch(r'\d+\.\d+\.\d+\.[1-9]\d*', requested):
                  sys.exit('::error::版本号必须是四段数字且第四段大于 0, 例如 0.1.8.1')
              version = requested
          else:
              url = f"https://{os.environ['COS_BUCKET']}.cos.{os.environ['COS_REGION']}.myqcloud.com/{os.environ['COS_PREFIX']}/versions.js"
              published = set()
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      text = response.read().decode('utf-8')
              except urllib.error.HTTPError as error:
                  # 还没有发布过正式版时清单不存在; 其他错误不猜版本号。
                  if error.code != 404:
                      raise
              else:
                  manifest = json.loads(text[text.index('{'):])
                  directory = os.environ['COS_PREFIX'] + '/prod/'
                  for item in manifest['files']:
                      match = re.match(re.escape(directory) + r'(\d+\.\d+\.\d+\.\d+)/', item['key'])
                      if match:
                          published.add(tuple(int(part) for part in match.group(1).split('.')))
              if published:
                  latest = max(published)
                  version = '.'.join(str(part) for part in (*latest[:3], latest[3] + 1))
                  print(f"最高正式版 {'.'.join(map(str, latest))}")
              else:
                  version = os.environ['WMH_FIRST_VERSION']
                  print('还没有正式版, 从起始版本开始')
          print(f'本次版本 {version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          EOF

  build:
    needs: plan
    name: 📦 ${{ matrix.target }} (${{ inputs.environment }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets == 'all' && '["macos-arm64","macos-x64","windows-x64"]' || format('["{0}"]', inputs.targets)) }}
    runs-on: ${{ matrix.target == 'macos-arm64' && 'macos-15' || matrix.target == 'macos-x64' && 'macos-15-intel' || 'windows-2025' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      WMH_ENVIRONMENT: ${{ inputs.environment }}
      WMH_VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - name: 📥 拉取源代码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🔧 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 🔧 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: ✅ 构建环境
        run: |
          echo "版本 $WMH_VERSION, Node $(node -v) $(node -p process.arch), pnpm $(pnpm -v)"

      - name: 🌐 载入环境配置
        run: |
          # 环境地址和服务凭据取自私有源码仓库的环境文件, 不写进这个公开仓库。
          # 复制成根目录 .env 由构建脚本自行读取; 不要写入 GITHUB_ENV, 否则会出现在公开日志里。
          case "$WMH_ENVIRONMENT" in
            test) channel=dev ;;
            prod) channel=stable ;;
          esac
          file="scripts/desktop/env/$WMH_ENVIRONMENT.env"
          if [ ! -f "$file" ]; then
            echo "::error::源码仓库缺少 $WMH_ENVIRONMENT 环境配置文件: $file"
            exit 1
          fi
          cp "$file" .env
          echo "WMH_DESKTOP_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 🪟 准备 NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ -and (Test-Path (Join-Path $_ 'NSIS/makensis.exe')) }
          if (-not $installed) { choco install nsis -y --no-progress }

      - name: 🚀 构建安装包 (macOS)
        if: runner.os == 'macOS'
        run: pnpm run build:macos --version "$WMH_VERSION"

      - name: 🚀 构建安装包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 构建脚本按 Windows 自带的 bsdtar 传盘符路径; Git 的 GNU tar 会把 "D:" 当成远程主机。
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          pnpm run build:windows --version "$env:WMH_VERSION"
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          # 构建中途的 pnpm install 会重写 node_modules\.bin\tsx.CMD; cmd 回到这个被改写的批处理时读到错位内容,
          # 即使构建脚本已正常结束也会返回失败。.release.json 是构建脚本最后写出的文件, 以它判断是否完成。
          $installer = Get-ChildItem .artifacts/windows-*/WealthWorkbench*-setup.exe -ErrorAction SilentlyContinue
          if ($installer.Count -eq 1 -and (Test-Path "$($installer.FullName).sha256") -and (Test-Path "$($installer.FullName).release.json")) {
            Write-Host "::warning::构建脚本已完成, 忽略 tsx 启动器的退出码 $code"
            exit 0
          }
          exit $code

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ☁️ 上传到腾讯云 COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [ -z "$COS_SECRET_ID" ] || [ -z "$COS_SECRET_KEY" ]; then
            echo "::error::仓库缺少 COS_SECRET_ID / COS_SECRET_KEY 这两个 secret"
            exit 1
          fi
          shopt -s nullglob
          files=(.artifacts/macos-*/WealthWorkbench*.dmg .artifacts/macos-*/WealthWorkbench*.dmg.sha256
                 .artifacts/windows-*/WealthWorkbench*-setup.exe .artifacts/windows-*/WealthWorkbench*-setup.exe.sha256)
          # 签名更新清单时用它核对版本、提交和公钥; 只需要带版本的一份。
          metadata=(.artifacts/macos-*/WealthWorkbench*.dmg.release.json .artifacts/windows-*/WealthWorkbench*-setup.exe.release.json)
          if [ "${#files[@]}" -ne 2 ] || [ "${#metadata[@]}" -ne 1 ]; then
            echo "::error::应当恰好有一个安装包及其 .sha256 和 .release.json, 实际找到 ${#files[@]} + ${#metadata[@]} 个文件"
            exit 1
          fi
          python -m pip install --quiet coscmd
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" > /dev/null
          coscmd upload "${metadata[0]}" "$COS_PREFIX/$WMH_ENVIRONMENT/$WMH_VERSION/$(basename "${metadata[0]}")"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            # latest 一份去掉版本号, 每次覆盖, 下载页的固定链接指向它。
            latest="$(sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-/-/; s/-win10-11-x64-/-windows-x64-/' <<< "$name")"
            if [ "$latest" = "$name" ]; then
              echo "::error::无法从文件名得到 latest 名称: $name"
              exit 1
            fi
            versioned="$COS_PREFIX/$WMH_ENVIRONMENT/$WMH_VERSION/$name"
            coscmd upload "$file" "$versioned"
            # latest 在桶内由带版本的那份直接复制, 不再从构建机上传第二遍。
            coscmd copy -d Replaced -H "{'Cache-Control':'no-cache'}" \
              "$COS_BUCKET.cos.$COS_REGION.myqcloud.com/$versioned" "$COS_PREFIX/$WMH_ENVIRONMENT/latest/$latest"
          done

  manifest:
    name: 🗂️ 更新版本清单
    needs: [plan, build]
    # 清单只收录正式版; 部分平台失败时, 已上传的平台仍要进清单。
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🗂️ 生成并上传 versions.js
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          # 下载页用 <script> 加载这份清单, 不依赖存储桶的跨域设置。
          python -m pip install --quiet coscmd
          python - <<'EOF'
          import json, os
          from qcloud_cos import CosConfig, CosS3Client

          client = CosS3Client(CosConfig(Region=os.environ['COS_REGION'],
                                         SecretId=os.environ['COS_SECRET_ID'], SecretKey=os.environ['COS_SECRET_KEY']))
          prefix = os.environ['COS_PREFIX'] + '/prod/'
          files, marker = [], ''
          while True:
              page = client.list_objects(Bucket=os.environ['COS_BUCKET'], Prefix=prefix, Marker=marker, MaxKeys=1000)
              for item in page.get('Contents', []):
                  marker = item['Key']
                  if marker.endswith(('.dmg', '.exe')) and '/latest/' not in marker:
                      files.append({'key': marker, 'size': int(item['Size']), 'lastModified': item['LastModified']})
              if page.get('IsTruncated') != 'true':
                  break
              marker = page.get('NextMarker') or marker
          with open('versions.js', 'w', encoding='utf-8') as output:
              output.write('window.__WM_HARNESS_RELEASES__ = ' + json.dumps({'files': files}, ensure_ascii=False) + '\n')
          print(f'{len(files)} installers listed')
          EOF
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" > /dev/null
          coscmd upload -H "{'Cache-Control':'no-cache'}" versions.js "$COS_PREFIX/versions.js"

  feed:
    name: ✍️ 签名并发布更新清单
    needs: [plan, build]
    # 只有正式版发布在线更新; 测试包的版本号在两次正式版之间不变, 不发清单。
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    env:
      WMH_VERSION: ${{ needs.plan.outputs.version }}
      WMH_NOTES: ${{ inputs.notes }}
    steps:
      - name: 📥 拉取源代码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🔧 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ✍️ 签名并上传清单
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          WMH_UPDATE_PRIVATE_KEY: ${{ secrets.WMH_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$WMH_UPDATE_PRIVATE_KEY" ]; then
            echo "::error::仓库缺少 WMH_UPDATE_PRIVATE_KEY 这个 secret"
            exit 1
          fi
          umask 077
          work="$RUNNER_TEMP/feed"
          mkdir -p "$work"
          printf '%s\n' "$WMH_UPDATE_PRIVATE_KEY" > "$work/key.pem"
          origin="https://$COS_BUCKET.cos.$COS_REGION.myqcloud.com"
          python -m pip install --quiet coscmd
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" > /dev/null

          # 以桶里这个版本目录的实际内容为准: 打包失败的平台不在其中, 清单里保留它的上一版。
          python - > "$work/keys.txt" <<'EOF'
          import os
          from qcloud_cos import CosConfig, CosS3Client

          client = CosS3Client(CosConfig(Region=os.environ['COS_REGION'],
                                         SecretId=os.environ['COS_SECRET_ID'], SecretKey=os.environ['COS_SECRET_KEY']))
          directory = f"{os.environ['COS_PREFIX']}/prod/{os.environ['WMH_VERSION']}/"
          page = client.list_objects(Bucket=os.environ['COS_BUCKET'], Prefix=directory, MaxKeys=1000)
          for item in page.get('Contents', []):
              if item['Key'].endswith(('.dmg', '.exe', '.release.json')):
                  print(item['Key'])
          EOF
          while IFS= read -r key; do
            curl --fail --silent --show-error --retry 2 --output "$work/$(basename "$key")" "$origin/$key"
          done < "$work/keys.txt"

          installer() {
            shopt -s nullglob
            local found=("$work"/WealthWorkbench-*-"$1")
            [ "${#found[@]}" -le 1 ] || { echo "::error::版本目录里有多个 $1 安装包" >&2; exit 1; }
            printf '%s' "${found[0]:-}"
          }
          # 重跑同一版本时, 已经在清单里的平台不再重复发布。
          pending() {
            [ -n "$3" ] || return 1
            [ -f "$1" ] || return 0
            node -e '
              const feed = JSON.parse(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).payload)
              process.exit(feed.releases.some(item => item.platform === process.argv[2] && item.version === process.argv[3]) ? 1 : 0)
            ' "$1" "$2" "$WMH_VERSION"
          }
          publish_feed() {
            local name="$1" architecture="$2" mac="$3" windows="$4" previous="$work/previous-$1" arguments=() first=""
            local status
            status="$(curl --silent --show-error --output "$previous" --write-out '%{http_code}' "$origin/$COS_PREFIX/prod/$name")"
            case "$status" in
              200) arguments+=(--previous "$previous") ;;
              404) rm -f "$previous" ;;
              *) echo "::error::读取现有清单 $name 失败: HTTP $status"; exit 1 ;;
            esac
            if pending "$previous" "macos-$architecture" "$mac"; then arguments+=(--mac "$mac" --mac-arch "$architecture"); first="$mac"; fi
            if pending "$previous" windows-x64 "$windows"; then arguments+=(--windows "$windows"); first="${first:-$windows}"; fi
            if [ -z "$first" ]; then
              echo "$name: 没有需要发布的平台"
              return
            fi
            local commit
            commit="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).commit' "$first.release.json")"
            node scripts/desktop/release.mjs --key "$work/key.pem" --version "$WMH_VERSION" --commit "$commit" \
              --notes "$WMH_NOTES" "${arguments[@]}" --output "$work/$name"
            coscmd upload -H "{'Cache-Control':'no-cache'}" "$work/$name" "$COS_PREFIX/prod/$name"
          }
          publish_feed wealth-workbench-updates.json arm64 "$(installer macos-arm64.dmg)" "$(installer win10-11-x64-setup.exe)"
          publish_feed wealth-workbench-updates-macos-x64.json x64 "$(installer macos-x64.dmg)" ""
          rm -f "$work/key.pem"
